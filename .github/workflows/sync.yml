name: Auto Sync Upstream
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  # 强制使用 Node24，消除弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 关键：授予仓库写入权限，解决 128 权限错误
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote add upstream https://github.com/qq148376839/tvbox-source-aggregator.git

      - name: Fetch upstream
        run: git fetch upstream

      # 优先使用 rebase 减少冲突（比 merge 更适合同步 fork）
      - name: Rebase to upstream/main
        run: git rebase upstream/main

      - name: Push changes
        run: git push origin HEAD:main --force-with-lease
